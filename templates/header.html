<header class="fixed top-0 w-full z-50 bg-white/80 dark:bg-[#0a0a0e]/80 backdrop-blur-md border-b border-gray-200 dark:border-white/5 transition-colors duration-300">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <a href="/" class="text-xl font-bold text-gray-900 dark:text-white tracking-tight flex items-center gap-2">
            <svg class="w-6 h-6 text-purple-600 dark:text-purple-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            TicketNow
        </a>

        <nav class="hidden md:flex gap-8 text-sm font-medium text-gray-600 dark:text-gray-300">
            <a href="/eventos" class="hover:text-purple-600 dark:hover:text-white transition">Eventos</a>
            <a href="/tienda" class="hover:text-purple-600 dark:hover:text-white transition">Tienda</a>
            <a href="/noticias" class="hover:text-purple-600 dark:hover:text-white transition">Noticias</a>
            <a href="/ticketapp" class="text-purple-600 dark:text-purple-400 font-bold">Ticket APP</a>
            <a href="/ayuda" class="hover:text-purple-600 dark:hover:text-white transition">Ayuda</a>
        </nav>
        
        <div class="flex items-center gap-2 md:gap-4">
            <a href="/carrito" class="relative text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-white/10 rounded-full p-2.5 transition group" aria-label="Ir al carrito">
                <svg class="w-5 h-5 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span id="cart-badge" class="absolute top-1 right-1 flex items-center justify-center w-4 h-4 bg-red-500 text-white text-[9px] font-bold rounded-full border-2 border-white dark:border-[#0a0a0e] opacity-0 transition-opacity">0</span>
            </a>

            <button id="theme-toggle" type="button" onclick="window.toggleTheme()" class="text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-white/10 rounded-full text-sm p-2.5 transition cursor-pointer relative z-[100]">
                <svg id="theme-toggle-dark-icon" class="w-5 h-5 dark:hidden pointer-events-none" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                <svg id="theme-toggle-light-icon" class="w-5 h-5 hidden dark:block pointer-events-none" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4.22 2.32a1 1 0 011.415 1.415l-.708.708a1 1 0 01-1.414-1.414l.707-.707zm-9.854 0l.707.708a1 1 0 11-1.414 1.414L3.366 5.736a1 1 0 011.415-1.415zM10 6a4 4 0 100 8 4 4 0 000-8zm-4 4a1 1 0 11-2 0 1 1 0 012 0zm11 0a1 1 0 11-2 0 1 1 0 012 0zm-7 5a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm-4.22-2.32l.707-.707a1 1 0 111.414 1.414l-.707.707a1 1 0 01-1.414-1.414zm11.314 0a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414l-.707.707z"></path></svg>
            </button>

            <button id="menu-toggle" type="button" class="md:hidden text-gray-500 dark:text-gray-400 p-2.5 rounded-xl hover:bg-gray-200 dark:hover:bg-white/10 transition" aria-label="Abrir menú">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path id="menu-icon-path" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>

            {% if usuario %}
                <a href="/perfil" class="hidden md:block text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-purple-600 dark:hover:text-white transition">Mi Perfil</a>
            {% else %}
                <a href="/auth" class="hidden md:block text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-purple-600 dark:hover:text-white transition">Ingresar</a>
            {% endif %}
        </div>
    </div>
</header>

<div id="mobile-menu" class="fixed inset-0 bg-white dark:bg-[#0a0a0e] pt-32 px-8 shadow-none transform translate-x-full transition-transform duration-300 ease-in-out md:hidden z-40 h-dvh w-full overflow-y-auto">
    <nav class="flex flex-col items-center justify-start mt-6 gap-8 text-xl font-bold text-gray-900 dark:text-gray-100 h-full">
        <a href="/eventos" class="hover:text-purple-600 dark:hover:text-purple-400 transition-colors py-2">Eventos</a>
        <a href="/tienda" class="hover:text-purple-600 dark:hover:text-purple-400 transition-colors py-2">Tienda</a>
        <a href="/noticias" class="hover:text-purple-600 dark:hover:text-purple-400 transition-colors py-2">Noticias</a>
        <a href="/ticketapp" class="text-purple-600 dark:text-purple-400 py-2 w-full text-center">Ticket APP</a>
        <a href="/ayuda" class="hover:text-purple-600 dark:hover:text-purple-400 transition-colors py-2">Ayuda</a>
        
        <div class="w-full max-w-xs mt-4 mb-20 space-y-4">
            <button id="mobile-theme-toggle" type="button" onclick="window.toggleTheme()" class="w-full text-center bg-gray-200 hover:bg-gray-300 dark:bg-white/10 dark:hover:bg-white/20 text-gray-900 dark:text-white py-4 rounded-full text-sm font-bold transition-colors flex items-center justify-center gap-2">
                <svg class="w-5 h-5 dark:hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4.22 2.32a1 1 0 011.415 1.415l-.708.708a1 1 0 01-1.414-1.414l.707-.707zm-9.854 0l.707.708a1 1 0 11-1.414 1.414L3.366 5.736a1 1 0 011.415-1.415zM10 6a4 4 0 100 8 4 4 0 000-8zm-4 4a1 1 0 11-2 0 1 1 0 012 0zm11 0a1 1 0 11-2 0 1 1 0 012 0zm-7 5a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm-4.22-2.32l.707-.707a1 1 0 111.414 1.414l-.707.707a1 1 0 01-1.414-1.414zm11.314 0a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414l-.707.707z"></path></svg>
                <svg class="w-5 h-5 hidden dark:block" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                <span class="dark:hidden">Modo Oscuro</span>
                <span class="hidden dark:block">Modo Claro</span>
            </button>
            {% if usuario %}
                <a href="/perfil" class="block w-full text-center bg-purple-600 hover:bg-purple-700 text-white py-4 rounded-full text-sm font-bold shadow-lg shadow-purple-600/20 transition-colors">
                    Mi Perfil
                </a>
            {% else %}
                <a href="/auth" class="block w-full text-center bg-purple-600 hover:bg-purple-700 text-white py-4 rounded-full text-sm font-bold shadow-lg shadow-purple-600/20 transition-colors">
                    Iniciar Sesión
                </a>
            {% endif %}
        </div>
    </nav>
</div>

<script>
    window.toggleTheme = () => {
        document.documentElement.classList.toggle('dark');
        const isDark = document.documentElement.classList.contains('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    };

    (() => {
        // Control del Menú Hamburguesa Móvil
        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        const iconPath = document.getElementById('menu-icon-path');

        if (menuToggle && mobileMenu && iconPath) {
            let isOpen = false;
            menuToggle.addEventListener('click', () => {
                isOpen = !isOpen;
                if (isOpen) {
                    mobileMenu.classList.remove('translate-x-full');
                    iconPath.setAttribute('d', 'M6 18L18 6M6 6l12 12'); // Cambia a ícono X
                    document.body.style.overflow = 'hidden'; // Evita que se haga scroll detrás del menú
                } else {
                    mobileMenu.classList.add('translate-x-full');
                    iconPath.setAttribute('d', 'M4 6h16M4 12h16M4 18h16'); // Vuelve al ícono Hamburguesa
                    document.body.style.overflow = ''; 
                }
            });
        }

        // Control del Indicador de Ítems en el Carrito
        const updateCartBadge = () => {
            const badge = document.getElementById('cart-badge');
            if (!badge) return;
            const cartData = JSON.parse(localStorage.getItem('ticketnow_cart') || '[]');
            const totalItems = cartData.reduce((sum, item) => sum + item.quantity, 0);
            if (totalItems > 0) { 
                badge.textContent = totalItems.toString(); 
                badge.classList.remove('opacity-0', 'scale-50'); 
                badge.classList.add('opacity-100', 'scale-100'); 
            } else { 
                badge.classList.add('opacity-0', 'scale-50'); 
                badge.classList.remove('opacity-100', 'scale-100'); 
            }
        };
        updateCartBadge(); 
        window.addEventListener('storage', updateCartBadge);
        setInterval(updateCartBadge, 1000);

        // Animación de Vuelo y Notificación (Toast) al agregar al carrito
        document.addEventListener('itemAddedToCart', ((e) => {
            const { startX, startY, title, bgClass } = e.detail;
            const cartIcon = document.querySelector('a[href="/carrito"]');
            if (!cartIcon) return;

            const cartRect = cartIcon.getBoundingClientRect();
            const endX = cartRect.left + cartRect.width / 2;
            const endY = cartRect.top + cartRect.height / 2;

            const flyer = document.createElement('div');
            flyer.className = `fixed z-[9999] w-16 h-16 rounded-xl shadow-2xl pointer-events-none bg-gradient-to-br ${bgClass}`;
            flyer.style.left = `${startX - 32}px`;
            flyer.style.top = `${startY - 32}px`;
            flyer.style.transition = 'transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-in, width 0.8s, height 0.8s';
            document.body.appendChild(flyer);

            requestAnimationFrame(() => {
                flyer.style.transform = `translate(${endX - startX}px, ${endY - startY}px) rotate(15deg)`;
                flyer.style.width = '10px';
                flyer.style.height = '10px';
                flyer.style.opacity = '0.3';
            });

            setTimeout(() => {
                flyer.remove();
                updateCartBadge();
                cartIcon.classList.add('scale-125', 'text-purple-500');
                setTimeout(() => cartIcon.classList.remove('scale-125', 'text-purple-500'), 300);
            }, 800);

            let toastContainer = document.getElementById('toast-container');
            if (!toastContainer) {
                toastContainer = document.createElement('div');
                toastContainer.id = 'toast-container';
                toastContainer.className = 'fixed bottom-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none';
                document.body.appendChild(toastContainer);
            }

            const toast = document.createElement('div');
            toast.className = 'bg-white dark:bg-[#12121a] border border-gray-200 dark:border-white/10 px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-4 transform translate-y-10 opacity-0 transition-all duration-300 pointer-events-auto';
            toast.innerHTML = `
                <div class="w-10 h-10 bg-green-100 dark:bg-green-500/20 text-green-600 dark:text-green-400 rounded-full flex items-center justify-center shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <div>
                    <p class="text-sm font-bold text-gray-900 dark:text-white mb-0.5">¡Añadido al carrito!</p>
                    <p class="text-xs text-gray-500 dark:text-gray-400 line-clamp-1">${title}</p>
                </div>
                <a href="/carrito" class="ml-2 bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold px-4 py-2 rounded-xl transition whitespace-nowrap shadow-md">Ver</a>
            `;
            toastContainer.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');
            });

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        });
    })();
</script>
