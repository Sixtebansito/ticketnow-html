{% extends 'base.html' %}

{% block content %}
<main class="pt-32 pb-20 min-h-screen bg-gray-50 dark:bg-[#0a0a0e] transition-colors duration-300">
    
    <section class="max-w-3xl px-6 mx-auto mb-16 text-center">
        <h1 class="mb-6 text-4xl font-extrabold text-gray-900 md:text-5xl dark:text-white">¿Cómo podemos ayudarte?</h1>
        <div class="relative">
            <input type="text" placeholder="Describe tu problema (ej. 'descargar ticket')" 
                class="w-full bg-white dark:bg-[#12121a] border border-gray-200 dark:border-white/5 rounded-full py-4 px-8 text-gray-900 dark:text-white shadow-lg focus:outline-none focus:ring-2 focus:ring-purple-500 transition">
            <button class="absolute px-6 py-2 font-bold text-white transition bg-purple-600 rounded-full right-2 top-2 hover:bg-purple-700">
                Buscar
            </button>
        </div>
    </section>

    <section class="max-w-4xl px-6 mx-auto">
        <h2 class="mb-8 text-2xl font-bold text-gray-900 dark:text-white">Preguntas frecuentes</h2>
        
        <div class="space-y-4">
            {% for faq in faqs %}
                <div class="faq-item bg-white dark:bg-[#12121a] border border-gray-200 dark:border-white/5 rounded-2xl overflow-hidden transition-colors">
                    <button class="flex items-center justify-between w-full p-6 font-semibold text-left text-gray-900 dark:text-white">
                        {{ faq.pregunta }}
                        <span class="text-xl font-bold text-purple-600 transition faq-icon dark:text-purple-400">+</span>
                    </button>
                    <div class="hidden p-6 pt-0 text-sm text-gray-600 faq-content dark:text-gray-400">
                        {{ faq.respuesta }}
                    </div>
                </div>
            {% endfor %}
        </div>

        <div class="p-8 mt-16 text-center border bg-purple-600/10 border-purple-500/20 rounded-2xl">
            <h3 class="mb-2 font-bold text-gray-900 dark:text-white">¿No encontraste lo que buscabas?</h3>
            <p class="mb-6 text-sm text-gray-600 dark:text-gray-400">Nuestro equipo de soporte está disponible 24/7 para ayudarte.</p>
            <button class="px-8 py-3 font-bold text-white transition bg-purple-600 rounded-full hover:bg-purple-700">
                Chat en vivo
            </button>
        </div>
    </section>
</main>

<script>
    document.querySelectorAll('.faq-item').forEach(item => {
        const button = item.querySelector('button');
        const content = item.querySelector('.faq-content');
        const icon = item.querySelector('.faq-icon');

        button?.addEventListener('click', () => {
            const isOpen = !content?.classList.contains('hidden');
            
            // Cerrar todos los demás antes de abrir el seleccionado
            document.querySelectorAll('.faq-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.faq-icon').forEach(i => i.textContent = '+');

            if (!isOpen) {
                content?.classList.remove('hidden');
                if (icon) icon.textContent = '-';
            }
        });
    });
</script>
{% endblock %}
