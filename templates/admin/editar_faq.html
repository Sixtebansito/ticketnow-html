{% extends 'base.html' %}

{% block content %}
<main class="pt-32 pb-20 min-h-screen bg-gray-50 dark:bg-[#0a0a0e] transition-colors duration-300">
    <div class="px-6 mx-auto max-w-4xl">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white">Editar FAQ</h1>
            <a href="{{ url_for('admin_faqs') }}" class="px-4 py-2 text-sm font-bold text-gray-700 transition bg-white border border-gray-200 shadow-sm dark:bg-[#12121a] dark:text-gray-300 dark:border-white/10 rounded-xl hover:bg-gray-50 dark:hover:bg-white/5">Volver a FAQs</a>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="p-4 mb-6 text-green-700 bg-green-100 rounded-xl dark:bg-green-500/10 dark:text-green-400">
            {% for message in messages %}
              {{ message }}
            {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <div class="p-6 bg-white border border-gray-200 shadow-sm dark:bg-[#12121a] dark:border-white/5 rounded-2xl">
            <form action="{{ url_for('admin_editar_faq', faq_id=faq.id) }}" method="POST" class="space-y-6">
                
                <div>
                    <label class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300">Pregunta</label>
                    <input type="text" name="pregunta" required value="{{ faq.pregunta }}" class="w-full px-4 py-2 text-gray-900 bg-gray-50 border border-gray-300 rounded-xl dark:bg-[#1a1a24] dark:border-white/10 dark:text-white focus:ring-2 focus:ring-purple-500 focus:outline-none">
                </div>
                
                <div>
                    <label class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300">Respuesta</label>
                    <textarea name="respuesta" required rows="6" class="w-full px-4 py-2 text-gray-900 bg-gray-50 border border-gray-300 rounded-xl dark:bg-[#1a1a24] dark:border-white/10 dark:text-white focus:ring-2 focus:ring-purple-500 focus:outline-none">{{ faq.respuesta }}</textarea>
                </div>

                <div class="flex justify-end">
                    <button type="submit" class="px-6 py-3 font-bold text-white transition bg-purple-600 rounded-xl hover:bg-purple-700 shadow-lg shadow-purple-600/20">Actualizar FAQ</button>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}
