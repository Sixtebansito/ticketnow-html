{% extends 'base.html' %}

{% block content %}
<main class="pt-32 pb-20 min-h-screen bg-gray-50 dark:bg-[#0a0a0e] transition-colors duration-300">
    <div class="px-6 mx-auto max-w-3xl">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white">Editar Mercancía</h1>
            <a href="{{ url_for('admin_mercancia') }}" class="px-4 py-2 text-sm font-bold text-gray-700 transition bg-white border border-gray-200 shadow-sm dark:bg-[#12121a] dark:text-gray-300 dark:border-white/10 rounded-xl hover:bg-gray-50 dark:hover:bg-white/5">
                Volver
            </a>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="p-4 mb-6 text-green-700 bg-green-100 rounded-xl dark:bg-green-500/10 dark:text-green-400">
            {% for message in messages %}
              {{ message }}
            {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <div class="p-6 bg-white border border-gray-200 shadow-sm dark:bg-[#12121a] dark:border-white/5 rounded-2xl">
            <form action="{{ url_for('editar_mercancia', id=mercancia.id) }}" method="POST" class="space-y-4">
                
                <div>
                    <label class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300">Título</label>
                    <input type="text" name="titulo" value="{{ mercancia.titulo }}" required class="w-full px-4 py-2 text-gray-900 bg-gray-50 border border-gray-300 rounded-xl dark:bg-[#1a1a24] dark:border-white/10 dark:text-white focus:ring-2 focus:ring-purple-500 focus:outline-none">
                </div>

                <div>
                    <label class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300">Descripción</label>
                    <textarea name="descripcion" required rows="4" class="w-full px-4 py-2 text-gray-900 bg-gray-50 border border-gray-300 rounded-xl dark:bg-[#1a1a24] dark:border-white/10 dark:text-white focus:ring-2 focus:ring-purple-500 focus:outline-none">{{ mercancia.descripcion }}</textarea>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300">Precio</label>
                        <input type="number" step="0.01" name="precio" value="{{ mercancia.precio }}" required class="w-full px-4 py-2 text-gray-900 bg-gray-50 border border-gray-300 rounded-xl dark:bg-[#1a1a24] dark:border-white/10 dark:text-white focus:ring-2 focus:ring-purple-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300">Categoría</label>
                        <select name="categoria" required class="w-full px-4 py-2 text-gray-900 bg-gray-50 border border-gray-300 rounded-xl dark:bg-[#1a1a24] dark:border-white/10 dark:text-white focus:ring-2 focus:ring-purple-500 focus:outline-none">
                            <option value="Ropa" {% if mercancia.categoria == 'Ropa' %}selected{% endif %}>Ropa</option>
                            <option value="Accesorios" {% if mercancia.categoria == 'Accesorios' %}selected{% endif %}>Accesorios</option>
                            <option value="Coleccionables" {% if mercancia.categoria == 'Coleccionables' %}selected{% endif %}>Coleccionables</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300">Colores (separados por coma)</label>
                    <input type="text" name="colores" value="{{ mercancia.colores or '' }}" class="w-full px-4 py-2 text-gray-900 bg-gray-50 border border-gray-300 rounded-xl dark:bg-[#1a1a24] dark:border-white/10 dark:text-white focus:ring-2 focus:ring-purple-500 focus:outline-none">
                </div>

                <div>
                    <label class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300">URL de Imagen (o código SVG)</label>
                    <textarea name="imagenUrl" rows="4" class="w-full px-4 py-2 text-gray-900 bg-gray-50 border border-gray-300 rounded-xl dark:bg-[#1a1a24] dark:border-white/10 dark:text-white focus:ring-2 focus:ring-purple-500 focus:outline-none" placeholder="https://... o <svg>...</svg>">{{ mercancia.imagenUrl or '' }}</textarea>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full px-6 py-3 font-bold text-white transition bg-purple-600 rounded-xl hover:bg-purple-700">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}
