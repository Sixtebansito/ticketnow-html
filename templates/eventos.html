{% extends 'base.html' %}

{% block content %}
<main class="pt-32 pb-20 min-h-screen bg-gray-50 dark:bg-[#0a0a0e] transition-colors duration-300">
    <div class="px-6 mx-auto mb-8 max-w-7xl">
        <h1 class="mb-2 text-4xl font-extrabold text-gray-900 dark:text-white">Cartelera de Eventos</h1>
        <p class="text-sm text-gray-600 dark:text-gray-400">Encuentra tus boletos al instante.</p>
    </div>

    <section class="max-w-7xl mx-auto px-6 mt-4 mb-16 transition-colors duration-300 buscador-inteligente" 
        data-es-index="false"
        data-redirect=""
        data-target=".wrapper-evento">

        <div class="flex flex-col lg:flex-row items-center gap-4 w-full">
            <div class="relative w-full grow">
                <svg class="absolute left-5 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400 dark:text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                
                <input type="text" placeholder="Filtrar eventos..." 
                    class="input-buscador w-full bg-white dark:bg-[#12121a] border border-gray-300 dark:border-white/5 rounded-full py-4 pl-12 pr-28 md:pr-32 text-gray-900 dark:text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition shadow-sm dark:shadow-none"
                >
            </div>

            <div class="flex gap-3 overflow-x-auto w-full lg:w-auto pb-2 lg:pb-0 items-center" style="scrollbar-width: none;">
                <button class="btn-filtro bg-purple-600 text-white px-6 py-3 rounded-full text-sm font-semibold whitespace-nowrap transition shadow-lg shadow-purple-500/20" data-cat="todos">
                    Todos
                </button>
                <button class="btn-filtro bg-gray-200 dark:bg-[#1a1a24] text-gray-700 dark:text-gray-300 px-6 py-3 rounded-full text-sm font-medium whitespace-nowrap transition hover:bg-gray-300 dark:hover:bg-[#252530]" data-cat="conciertos">
                    Conciertos
                </button>
                <button class="btn-filtro bg-gray-200 dark:bg-[#1a1a24] text-gray-700 dark:text-gray-300 px-6 py-3 rounded-full text-sm font-medium whitespace-nowrap transition hover:bg-gray-300 dark:hover:bg-[#252530]" data-cat="teatro">
                    Teatro
                </button>
                <button class="btn-filtro bg-gray-200 dark:bg-[#1a1a24] text-gray-700 dark:text-gray-300 px-6 py-3 rounded-full text-sm font-medium whitespace-nowrap transition hover:bg-gray-300 dark:hover:bg-[#252530]" data-cat="deportes">
                    Deportes
                </button>
            </div>
        </div>
    </section>

    <div class="grid grid-cols-1 gap-6 px-6 mx-auto mt-8 max-w-7xl md:grid-cols-2 lg:grid-cols-3">
        {% for ev in eventos %}
        <div class="wrapper-evento" data-title="{{ ev.tit|lower }}" data-category="{{ ev.cat|lower }}">
            <div class="group relative rounded-4xl overflow-hidden shadow-md hover:shadow-2xl dark:hover:shadow-purple-900/20 transition-all duration-500 flex flex-col h-[420px] w-full border border-gray-200/50 dark:border-white/5">
                {% if ev.imagen %}
                    <div class="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-110" style="background-image: url('{{ ev.imagen }}');"></div>
                {% else %}
                    <div class="absolute inset-0 bg-gradient-to-br {{ ev.bg }} transition-transform duration-700 group-hover:scale-110"></div>
                {% endif %}

                <div class="absolute inset-0 bg-gradient-to-t from-[#0a0a0e] via-[#0a0a0e]/60 to-transparent opacity-95"></div>

                <div class="absolute top-6 w-full flex justify-center z-10">
                    <span class="px-4 py-1.5 rounded-full text-[10px] font-extrabold uppercase tracking-widest {{ ev.tag }} {{ ev.txt }} backdrop-blur-md shadow-sm">
                        {{ ev.cat }}
                    </span>
                </div>

                <div class="relative z-10 p-6 md:p-8 flex flex-col h-full justify-end items-center text-center mt-auto">
                    <a href="/detalle-evento/{{ ev.id }}" class="hover:text-purple-400 transition-colors">
                        <h3 class="text-2xl md:text-3xl font-extrabold text-white mb-2 leading-tight drop-shadow-md">{{ ev.tit }}</h3>
                    </a>
                    <p class="text-gray-300 text-xs md:text-sm mb-6 font-medium drop-shadow">15 Agosto 2026 • Estadio Atahualpa</p>
                    
                    <div class="w-full flex flex-col items-center gap-5">
                        <span class="text-3xl font-black text-white drop-shadow-md">{{ ev.precio }}</span>
                        
                        <div class="flex w-full gap-3 justify-center">
                            <a href="/detalle-evento/{{ ev.id }}" class="w-1/2 py-3 rounded-xl text-xs font-bold border border-white/20 text-white hover:bg-white/10 transition flex items-center justify-center backdrop-blur-sm">
                                Ver Detalles
                            </a>
                            
                            <button class="btn-comprar-evento w-1/2 bg-purple-600 hover:bg-purple-500 text-white py-3 rounded-xl text-xs font-bold transition shadow-lg shadow-purple-600/40"
                                data-id="{{ ev.id }}" 
                                data-title="{{ ev.tit }}" 
                                data-price="{{ ev.precio|replace('$', '') }}" 
                                data-category="{{ ev.cat }}">
                                Comprar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</main>

<script>
    const setupBuscadores = () => {
        const contenedores = document.querySelectorAll('.buscador-inteligente');

        contenedores.forEach(contenedor => {
            const redirectUrl = contenedor.getAttribute('data-redirect');
            const targetSelector = contenedor.getAttribute('data-target') || '.wrapper-evento';
            const input = contenedor.querySelector('.input-buscador');
            const botonesFiltro = contenedor.querySelectorAll('.btn-filtro');

            if (!input) return;

            const urlParams = new URLSearchParams(window.location.search);
            const searchParam = urlParams.get('search') || '';
            const categoryParam = urlParams.get('category') || 'todos';

            if (!redirectUrl) input.value = searchParam;

            botonesFiltro.forEach(btn => {
                const cat = btn.getAttribute('data-cat') || 'todos';
                if (cat === categoryParam) {
                    btn.className = 'btn-filtro bg-purple-600 text-white px-6 py-3 rounded-full text-sm font-semibold whitespace-nowrap transition shadow-lg shadow-purple-500/20';
                } else {
                    btn.className = 'btn-filtro bg-gray-200 dark:bg-[#1a1a24] text-gray-700 dark:text-gray-300 px-6 py-3 rounded-full text-sm font-medium whitespace-nowrap transition hover:bg-gray-300 dark:hover:bg-[#252530]';
                }
            });

            const aplicarFiltroLocal = () => {
                const texto = input.value.toLowerCase().trim();
                let catActiva = 'todos';
                botonesFiltro.forEach(b => { if (b.classList.contains('bg-purple-600')) catActiva = b.getAttribute('data-cat') || 'todos'; });

                const tarjetas = document.querySelectorAll(targetSelector);
                tarjetas.forEach(tarjeta => {
                    const tituloCard = tarjeta.getAttribute('data-title') || '';
                    const categoriaCard = tarjeta.getAttribute('data-category') || '';
                    const coincideTexto = tituloCard.includes(texto);
                    const coincideCategoria = catActiva === 'todos' || categoriaCard === catActiva || categoriaCard.includes(catActiva);

                    if (coincideTexto && coincideCategoria) {
                        tarjeta.style.display = 'block';
                        tarjeta.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, fill: 'forwards' });
                    } else {
                        tarjeta.style.display = 'none';
                    }
                });
            };

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') aplicarFiltroLocal();
            });
            
            input.addEventListener('input', () => { if (!redirectUrl) aplicarFiltroLocal(); });

            botonesFiltro.forEach(btn => {
                btn.addEventListener('click', () => {
                    botonesFiltro.forEach(b => b.className = 'btn-filtro bg-gray-200 dark:bg-[#1a1a24] text-gray-700 dark:text-gray-300 px-6 py-3 rounded-full text-sm font-medium whitespace-nowrap transition hover:bg-gray-300 dark:hover:bg-[#252530]');
                    btn.className = 'btn-filtro bg-purple-600 text-white px-6 py-3 rounded-full text-sm font-semibold whitespace-nowrap transition shadow-lg shadow-purple-500/20';
                    aplicarFiltroLocal();
                });
            });

            if (!redirectUrl) setTimeout(aplicarFiltroLocal, 50);
        });
    };

    const initBotonesEventoYProducto = () => {
        const botones = document.querySelectorAll('.btn-comprar-evento');
        botones.forEach(boton => {
            const newBtn = boton.cloneNode(true);
            boton.parentNode.replaceChild(newBtn, boton);
            
            newBtn.addEventListener('click', (e) => {
                e.preventDefault();
                let btn = e.target.closest('button');
                
                const id = btn.getAttribute('data-id');
                const title = btn.getAttribute('data-title');
                const priceStr = btn.getAttribute('data-price');
                const category = btn.getAttribute('data-category');
                const price = parseFloat(priceStr || '0');

                const textoOriginal = btn.textContent;
                btn.textContent = 'Añadiendo...';
                btn.classList.add('opacity-75', 'cursor-wait');
                btn.disabled = true;
                
                setTimeout(() => {
                    btn.textContent = '¡Añadido! ✅';
                    btn.classList.replace('bg-purple-600', 'bg-green-500');
                    btn.classList.replace('hover:bg-purple-500', 'hover:bg-green-400');
                    
                    setTimeout(() => {
                        btn.textContent = textoOriginal;
                        btn.classList.replace('bg-green-500', 'bg-purple-600');
                        btn.classList.replace('hover:bg-green-400', 'hover:bg-purple-500');
                        btn.classList.remove('opacity-75', 'cursor-wait');
                        btn.disabled = false;
                    }, 2000);
                }, 600);
                
                const item = {
                    id: id,
                    title: title,
                    price: price,
                    category: category,
                    type: 'evento',
                    quantity: 1
                };

                let cart = JSON.parse(localStorage.getItem('ticketnow_cart') || '[]');
                const existingIndex = cart.findIndex(i => i.id === item.id);
                if (existingIndex > -1) cart[existingIndex].quantity += 1;
                else cart.push(item);
                localStorage.setItem('ticketnow_cart', JSON.stringify(cart));

                const rect = btn.getBoundingClientRect();
                const event = new CustomEvent('itemAddedToCart', {
                    detail: {
                        startX: rect.left + rect.width / 2,
                        startY: rect.top + rect.height / 2,
                        title: title,
                        bgClass: 'from-purple-600 to-indigo-600'
                    }
                });
                document.dispatchEvent(event);
            });
        });
    };

    document.addEventListener('DOMContentLoaded', () => {
        setupBuscadores();
        initBotonesEventoYProducto();
    });
</script>
{% endblock %}
