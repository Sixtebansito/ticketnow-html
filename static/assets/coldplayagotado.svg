<svg viewBox="0 0 800 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fondo de gradiente oscuro/espacial -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0514"/>
      <stop offset="40%" stop-color="#1b0b36"/>
      <stop offset="80%" stop-color="#0b1b3d"/>
      <stop offset="100%" stop-color="#051024"/>
    </linearGradient>

    <!-- Sombra para el boleto -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="5" dy="15" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Gradiente para esferas decorativas -->
    <linearGradient id="sphere1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7a00ff"/>
    </linearGradient>
    <linearGradient id="sphere2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="100%" height="100%" fill="url(#bg-gradient)"/>

  <!-- Elementos de fondo (Esferas estilo Coldplay) -->
  <circle cx="120" cy="100" r="90" fill="url(#sphere1)" opacity="0.3" filter="blur(20px)"/>
  <circle cx="680" cy="400" r="130" fill="url(#sphere2)" opacity="0.25" filter="blur(25px)"/>
  <circle cx="700" cy="120" r="50" fill="#ffea00" opacity="0.4" filter="blur(15px)"/>
  <circle cx="150" cy="400" r="60" fill="#00ffcc" opacity="0.2" filter="blur(15px)"/>

  <!-- Estrellas / Puntos de luz -->
  <circle cx="200" cy="80" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="600" cy="150" r="3" fill="#fff" opacity="0.6"/>
  <circle cx="750" cy="300" r="2" fill="#fff" opacity="0.9"/>
  <circle cx="100" cy="350" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="400" cy="50" r="2" fill="#fff" opacity="0.7"/>

  <!-- Forma del Boleto (Ticket) -->
  <path d="M 150 120 
           H 650 
           V 220 
           a 30 30 0 0 0 0 60 
           V 380 
           H 150 
           V 280 
           a 30 30 0 0 0 0 -60 
           Z" 
        fill="#ffffff" filter="url(#drop-shadow)"/>

  <!-- Línea divisoria del boleto -->
  <line x1="500" y1="130" x2="500" y2="370" stroke="#d1d5db" stroke-width="3" stroke-dasharray="10, 10" />

  <!-- Texto del Boleto: Izquierda -->
  <text x="325" y="190" font-family="Arial Black, Impact, sans-serif" font-size="52" fill="#111827" text-anchor="middle" letter-spacing="1">COLDPLAY</text>
  <text x="325" y="225" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#4b5563" text-anchor="middle" letter-spacing="3">MUSIC OF THE SPHERES</text>
  <text x="325" y="250" font-family="Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">WORLD TOUR</text>
  
  <rect x="250" y="280" width="150" height="30" rx="15" fill="#f3f4f6" />
  <text x="325" y="300" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#374151" text-anchor="middle">ENTRADA GENERAL</text>

  <!-- Texto del Boleto: Derecha (Stub) -->
  <g transform="translate(575, 250)">
    <text x="0" y="-70" font-family="Arial Black, sans-serif" font-size="22" fill="#111827" text-anchor="middle" transform="rotate(90)">COLDPLAY</text>
    
    <!-- Código de barras falso -->
    <rect x="-30" y="-30" width="60" height="4" fill="#111827" />
    <rect x="-30" y="-20" width="60" height="8" fill="#111827" />
    <rect x="-30" y="-7" width="60" height="3" fill="#111827" />
    <rect x="-30" y="0" width="60" height="10" fill="#111827" />
    <rect x="-30" y="15" width="60" height="5" fill="#111827" />
    <rect x="-30" y="25" width="60" height="12" fill="#111827" />
    <rect x="-30" y="42" width="60" height="4" fill="#111827" />
    <rect x="-30" y="50" width="60" height="8" fill="#111827" />
  </g>

  <!-- Sello de "AGOTADO" -->
  <g transform="translate(325, 260) rotate(-15)">
    <!-- Borde del sello -->
    <rect x="-170" y="-45" width="340" height="90" rx="10" fill="none" stroke="#dc2626" stroke-width="8" />
    <rect x="-160" y="-35" width="320" height="70" rx="5" fill="none" stroke="#dc2626" stroke-width="2" opacity="0.5"/>
    
    <!-- Texto del sello -->
    <text x="0" y="15" font-family="Arial Black, Impact, sans-serif" font-size="48" fill="#dc2626" text-anchor="middle" letter-spacing="4">¡AGOTADO!</text>
  </g>

  <!-- Insignia de 24h -->
  <g transform="translate(480, 360)">
    <circle cx="0" cy="0" r="50" fill="#fbbf24" filter="url(#drop-shadow)"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="0" y="5" font-family="Arial Black, sans-serif" font-size="34" fill="#000" text-anchor="middle">24H</text>
    <text x="0" y="28" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#000" text-anchor="middle" letter-spacing="1">RÉCORD</text>
  </g>

</svg>
