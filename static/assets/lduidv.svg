<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="stadiumGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#122544"/>
      <stop offset="50%" stop-color="#07101f"/>
      <stop offset="100%" stop-color="#02050b"/>
    </radialGradient>

    <!-- Gold Metallic Gradients for Trophy & Accents -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1b0"/>
      <stop offset="25%" stop-color="#e5b842"/>
      <stop offset="50%" stop-color="#caa02e"/>
      <stop offset="75%" stop-color="#fdf0a6"/>
      <stop offset="100%" stop-color="#9a7016"/>
    </linearGradient>

    <linearGradient id="goldHorizontal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67c1e"/>
      <stop offset="30%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#fff5c0"/>
      <stop offset="70%" stop-color="#f5d77f"/>
      <stop offset="100%" stop-color="#a67c1e"/>
    </linearGradient>

    <!-- Team Gradients -->
    <!-- IDV (Black, Deep Blue, Magenta Accent) -->
    <linearGradient id="idvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0055ff"/>
      <stop offset="50%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    
    <linearGradient id="idvPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#b30059"/>
    </linearGradient>

    <!-- LDU (White, Red, Blue) -->
    <linearGradient id="lduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e6ecf5"/>
      <stop offset="100%" stop-color="#b0c2de"/>
    </linearGradient>

    <linearGradient id="lduRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e60000"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>

    <!-- UI Shading & Filters -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="heavyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" fill="url(#stadiumGlow)"/>

  <!-- Stadium Lights & Beams -->
  <g opacity="0.15">
    <polygon points="0,0 250,500 0,600" fill="#00a2ff"/>
    <polygon points="800,0 550,500 800,600" fill="#ffffff"/>
    <polygon points="400,0 300,600 500,600" fill="#e5b842"/>
  </g>

  <!-- Dynamic Geometric Pitch Rays -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.04">
    <line x1="400" y1="500" x2="0" y2="0"/>
    <line x1="400" y1="500" x2="160" y2="0"/>
    <line x1="400" y1="500" x2="320" y2="0"/>
    <line x1="400" y1="500" x2="480" y2="0"/>
    <line x1="400" y1="500" x2="640" y2="0"/>
    <line x1="400" y1="500" x2="800" y2="0"/>
    <circle cx="400" cy="500" r="150" fill="none"/>
    <circle cx="400" cy="500" r="300" fill="none"/>
    <circle cx="400" cy="500" r="450" fill="none"/>
  </g>

  <!-- TOP HEADER: Tournament Branding -->
  <g transform="translate(400, 75)" text-anchor="middle" filter="url(#heavyShadow)">
    <!-- Badge Container -->
    <rect x="-140" y="0" width="280" height="28" rx="14" fill="#0a1526" stroke="url(#goldHorizontal)" stroke-width="1.5"/>
    <text x="0" y="19" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="13" font-weight="900" fill="url(#goldHorizontal)" letter-spacing="5">LIGA PRO ECUADOR</text>
    
    <!-- Match Type Title -->
    <text x="0" y="80" font-family="'Montserrat', 'Impact', sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="8">GRAN FINAL</text>
    
    <!-- Accent Underline -->
    <path d="M -120 100 L 120 100" stroke="url(#goldHorizontal)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="0,96 -8,100 0,104 8,100" fill="url(#goldHorizontal)"/>
  </g>

  <!-- CENTRAL BATTLE FIELD (TEAMS & TROPHY) -->

  <!-- LEFT TEAM: INDEPENDIENTE DEL VALLE -->
  <g transform="translate(190, 390)" filter="url(#heavyShadow)">
    <!-- Aura Glow -->
    <circle cx="0" cy="0" r="110" fill="#0055ff" opacity="0.15" filter="url(#glowGold)"/>
    
    <!-- Shield Outer Frame -->
    <path d="M -85,-110 L 85,-110 L 85,15 C 85,85 0,125 0,125 C 0,125 -85,85 -85,15 Z" fill="#050b14" stroke="#00d4ff" stroke-width="4"/>
    
    <!-- Inner Base Shield -->
    <path d="M -75,-100 L 75,-100 L 75,12 C 75,75 0,112 0,112 C 0,112 -75,75 -75,12 Z" fill="url(#idvGrad)"/>

    <!-- IDV Vertical Stripes -->
    <g opacity="0.85">
      <!-- Blue & Black Pattern -->
      <path d="M -45,-100 L -20,-100 L -20,95 C -29,88 -38,80 -45,70 Z" fill="#00d4ff"/>
      <path d="M 20,-100 L 45,-100 L 45,70 C 38,80 29,88 20,95 Z" fill="#00d4ff"/>
      <rect x="-10" y="-100" width="20" height="205" fill="#ff007f"/>
    </g>

    <!-- IDV Monogram Motif -->
    <circle cx="0" cy="-35" r="28" fill="#0a1224" stroke="url(#goldHorizontal)" stroke-width="2"/>
    <text x="0" y="-27" font-family="'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">IDV</text>

    <!-- Team Name Below Shield -->
    <text x="0" y="165" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">INDEPENDIENTE</text>
    <text x="0" y="188" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700" fill="#00d4ff" text-anchor="middle" letter-spacing="4">DEL VALLE</text>
  </g>

  <!-- RIGHT TEAM: LDU DE QUITO -->
  <g transform="translate(610, 390)" filter="url(#heavyShadow)">
    <!-- Aura Glow -->
    <circle cx="0" cy="0" r="110" fill="#ffffff" opacity="0.12" filter="url(#glowGold)"/>

    <!-- Shield Outer Frame -->
    <path d="M -85,-110 L 85,-110 L 85,15 C 85,85 0,125 0,125 C 0,125 -85,85 -85,15 Z" fill="#0b172a" stroke="#ffffff" stroke-width="4"/>
    
    <!-- Inner Base Shield -->
    <path d="M -75,-100 L 75,-100 L 75,12 C 75,75 0,112 0,112 C 0,112 -75,75 -75,12 Z" fill="url(#lduGrad)"/>

    <!-- LDU Red & Blue Triangular Inset (Upper Section) -->
    <polygon points="-75,-100 75,-100 0,-15" fill="url(#lduRed)"/>
    <polygon points="-75,-100 0,-15 -75,-15" fill="#002b66" opacity="0.6"/>

    <!-- Distinctive LDU Red "U" Symbol -->
    <path d="
      M -32,-75 L -14,-75 L -14,-35 C -14,-22 -7,-14 0,-14 C 7,-14 14,-22 14,-35 L 14,-75 L 32,-75 L 32,-35 C 32,-8 18,5 0,5 C -18,5 -32,-8 -32,-35 Z" 
      fill="#ffffff" stroke="#990000" stroke-width="1.5" filter="url(#softShadow)"/>

    <!-- Golden Championship Stars -->
    <g fill="url(#goldGrad)" transform="translate(0, 48)">
      <!-- 4 International Stars Representation -->
      <polygon points="0,0 2.5,7 9.5,7 4,11.5 6,18 0,14 -6,18 -4,11.5 -9.5,7 -2.5,7" transform="translate(-42,0) scale(0.7)"/>
      <polygon points="0,0 2.5,7 9.5,7 4,11.5 6,18 0,14 -6,18 -4,11.5 -9.5,7 -2.5,7" transform="translate(-14,-8) scale(0.8)"/>
      <polygon points="0,0 2.5,7 9.5,7 4,11.5 6,18 0,14 -6,18 -4,11.5 -9.5,7 -2.5,7" transform="translate(14,-8) scale(0.8)"/>
      <polygon points="0,0 2.5,7 9.5,7 4,11.5 6,18 0,14 -6,18 -4,11.5 -9.5,7 -2.5,7" transform="translate(42,0) scale(0.7)"/>
    </g>

    <!-- Team Name Below Shield -->
    <text x="0" y="165" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">LDU</text>
    <text x="0" y="188" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700" fill="#e5b842" text-anchor="middle" letter-spacing="4">QUITO</text>
  </g>

  <!-- CENTER: CHAMPIONSHIP TROPHY & "VS" BADGE -->
  <g transform="translate(400, 390)" filter="url(#heavyShadow)">
    <!-- Trophy Silhouette Graphic -->
    <g transform="translate(0, -35) scale(0.95)">
      <!-- Trophy Glow -->
      <ellipse cx="0" cy="10" rx="45" ry="85" fill="#f5d77f" opacity="0.2" filter="url(#glowGold)"/>
      
      <!-- Cup Base & Stem -->
      <path d="M -30,85 L 30,85 L 20,70 L -20,70 Z" fill="url(#goldGrad)"/>
      <rect x="-8" y="45" width="16" height="25" fill="url(#goldGrad)"/>
      <path d="M -16,45 C -16,45 -5,40 0,40 C 5,40 16,45 16,45 L 12,30 L -12,30 Z" fill="url(#goldGrad)"/>
      
      <!-- Main Cup Body -->
      <path d="M -35,-30 C -35,25 -20,35 0,35 C 20,35 35,25 35,-30 Z" fill="url(#goldGrad)"/>
      <!-- Handles -->
      <path d="M -33,-15 C -55,-15 -55,15 -30,22 L -30,14 C -45,10 -45,-5 -31,-7 Z" fill="url(#goldGrad)"/>
      <path d="M 33,-15 C 55,-15 55,15 30,22 L 30,14 C 45,10 45,-5 31,-7 Z" fill="url(#goldGrad)"/>
      
      <!-- Trophy Crown/Rim -->
      <ellipse cx="0" cy="-30" rx="35" ry="10" fill="url(#goldHorizontal)"/>
      <ellipse cx="0" cy="-30" rx="27" ry="6" fill="#684a0c"/>
    </g>

    <!-- VS Circular Crest -->
    <circle cx="0" cy="55" r="32" fill="#040914" stroke="url(#goldHorizontal)" stroke-width="3"/>
    <text x="0" y="64" font-family="'Impact', 'Arial Black', sans-serif" font-size="26" font-style="italic" fill="url(#goldHorizontal)" text-anchor="middle" letter-spacing="2">VS</text>
  </g>

  <!-- BOTTOM CARD: MATCH DETAILS & VENUE -->
  <g transform="translate(400, 680)" filter="url(#heavyShadow)">
    <!-- Container Card -->
    <rect x="-330" y="0" width="660" height="235" rx="20" fill="#07111e" stroke="#1c2d47" stroke-width="2"/>
    <rect x="-330" y="0" width="660" height="235" rx="20" fill="none" stroke="url(#goldHorizontal)" stroke-width="1" opacity="0.3"/>

    <!-- Date & Time Pill -->
    <g transform="translate(0, 48)">
      <rect x="-180" y="-22" width="360" height="44" rx="22" fill="#0f1f38" stroke="url(#goldHorizontal)" stroke-width="1.5"/>
      <!-- Calendar/Clock Icon Hybrid -->
      <circle cx="-135" cy="0" r="10" fill="none" stroke="url(#goldHorizontal)" stroke-width="2"/>
      <polyline points="-135,-5 -135,0 -131,2" stroke="url(#goldHorizontal)" stroke-width="2" fill="none"/>
      
      <!-- Match Date Text -->
      <text x="12" y="7" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="17" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">06 SEPTIEMBRE 2026</text>
      <text x="135" y="7" font-family="'Montserrat', sans-serif" font-size="16" font-weight="700" fill="url(#goldHorizontal)">12:55</text>
    </g>

    <!-- Divider -->
    <line x1="-220" y1="95" x2="220" y2="95" stroke="#1a2d4c" stroke-width="1.5"/>

    <!-- Stadium Venue Information -->
    <g transform="translate(0, 140)">
      <!-- Pin Marker Icon -->
      <path d="M 0,-22 C -7,-22 -12,-17 -12,-10 C -12,-1 0,10 0,10 C 0,10 12,-1 12,-10 C 12,-17 7,-22 0,-22 Z M 0,-7 C -2.2,-7 -4,-8.8 -4,-11 C -4,-13.2 -2.2,-15 0,-15 C 2.2,-15 4,-13.2 4,-11 C 4,-8.8 2.2,-7 0,-7 Z" fill="url(#goldHorizontal)"/>
      <text x="0" y="24" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="23" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">ESTADIO RODRIGO PAZ DELGADO</text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="0" y="202" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" fill="#8ca5cb" text-anchor="middle" letter-spacing="4">EL PARTIDO DECISIVO POR EL CAMPEONATO</text>
  </g>

  <!-- Bottom Brand Footer Strip -->
  <g transform="translate(400, 960)" text-anchor="middle" opacity="0.7">
    <line x1="-150" y1="0" x2="150" y2="0" stroke="url(#goldHorizontal)" stroke-width="1"/>
    <text x="0" y="20" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#a4bede" letter-spacing="6">ECUADOR 2026</text>
  </g>
</svg>
