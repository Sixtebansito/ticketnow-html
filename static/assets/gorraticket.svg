<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#16102b" />
      <stop offset="50%" stop-color="#0a0714" />
      <stop offset="100%" stop-color="#030205" />
    </radialGradient>

    <!-- Cap Base Gradients -->
    <radialGradient id="crownGrad" cx="45%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3a3a40" />
      <stop offset="40%" stop-color="#232328" />
      <stop offset="85%" stop-color="#121215" />
      <stop offset="100%" stop-color="#08080a" />
    </radialGradient>

    <radialGradient id="visorGrad" cx="50%" cy="50%" r="60%" fx="50%" fy="10%">
      <stop offset="0%" stop-color="#2a2a30" />
      <stop offset="60%" stop-color="#151518" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>

    <!-- Neon Branding Gradients -->
    <linearGradient id="neonBrand" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#6a00f4" />
      <stop offset="100%" stop-color="#fe0979" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <!-- Lighting / Shading Gradients -->
    <radialGradient id="leftLight" cx="0%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="rightLight" cx="100%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#fe0979" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fe0979" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="visorHighlight" cx="50%" cy="10%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000" flood-opacity="0.8" />
    </filter>

    <filter id="patchShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6" />
    </filter>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)" />

  <!-- Concert Atmosphere / Laser Lights -->
  <g opacity="0.15" stroke-width="2">
    <line x1="0" y1="800" x2="350" y2="0" stroke="#00f2fe" />
    <line x1="0" y1="600" x2="250" y2="0" stroke="#00f2fe" />
    <line x1="800" y1="800" x2="450" y2="0" stroke="#fe0979" />
    <line x1="800" y1="600" x2="550" y2="0" stroke="#fe0979" />
  </g>
  
  <!-- Ambient Particles -->
  <g fill="#ffffff" opacity="0.3">
    <circle cx="150" cy="200" r="1.5" />
    <circle cx="650" cy="300" r="2" />
    <circle cx="200" cy="650" r="1" />
    <circle cx="700" cy="550" r="1.5" />
    <circle cx="300" cy="100" r="1.2" />
    <circle cx="500" cy="700" r="2" />
  </g>

  <!-- Floor Shadow for Cap -->
  <ellipse cx="400" cy="670" rx="220" ry="25" fill="#000000" filter="blur(15px)" opacity="0.8" />

  <!-- ================= CAP ASSEMBLY ================= -->
  <g id="official-cap" filter="url(#dropShadow)">
    
    <!-- 1. Visor Bottom/Rim (Thickness) -->
    <path id="visor-rim" 
          d="M 165,420 
             C 165,580 290,670 400,670 
             C 510,670 635,580 635,420 
             C 635,440 520,695 400,695 
             C 280,695 165,440 165,420 Z" 
          fill="#08080a" />

    <!-- 2. Visor Main -->
    <path id="visor-main" 
          d="M 165,420 
             C 165,580 290,670 400,670 
             C 510,670 635,580 635,420 
             C 540,480 470,490 400,490 
             C 330,490 260,480 165,420 Z" 
          fill="url(#visorGrad)" />
          
    <path id="visor-highlight" 
          d="M 165,420 
             C 165,580 290,670 400,670 
             C 510,670 635,580 635,420 
             C 540,480 470,490 400,490 
             C 330,490 260,480 165,420 Z" 
          fill="url(#visorHighlight)" />

    <!-- Visor Stitching -->
    <g fill="none" stroke="#44444c" stroke-width="2" stroke-dasharray="6,4" opacity="0.6">
      <path d="M 195,438 C 220,560 310,640 400,640 C 490,640 580,560 605,438" />
      <path d="M 225,455 C 255,545 330,610 400,610 C 470,610 545,545 575,455" />
      <path d="M 255,472 C 285,530 345,580 400,580 C 455,580 515,530 545,472" />
    </g>

    <!-- 3. Crown Main -->
    <path id="crown-base" 
          d="M 235,445 
             C 235,220 310,140 400,140 
             C 490,140 565,220 565,445 
             C 510,485 290,485 235,445 Z" 
          fill="url(#crownGrad)" />

    <!-- Crown Colored Side Lighting (Cyan/Magenta glow) -->
    <path d="M 235,445 C 235,220 310,140 400,140 C 490,140 565,220 565,445 C 510,485 290,485 235,445 Z" fill="url(#leftLight)" />
    <path d="M 235,445 C 235,220 310,140 400,140 C 490,140 565,220 565,445 C 510,485 290,485 235,445 Z" fill="url(#rightLight)" />

    <!-- 4. Crown Seams & Stitches -->
    <g fill="none" opacity="0.8">
      <!-- Seam Base Shadows -->
      <path d="M 400,140 L 400,485" stroke="#111" stroke-width="4" />
      <path d="M 400,140 C 330,230 280,340 235,445" stroke="#111" stroke-width="4" />
      <path d="M 400,140 C 470,230 520,340 565,445" stroke="#111" stroke-width="4" />
      
      <!-- Actual Stitches -->
      <path d="M 395,145 L 395,483" stroke="#44444c" stroke-width="1.5" stroke-dasharray="4,3" />
      <path d="M 405,145 L 405,483" stroke="#44444c" stroke-width="1.5" stroke-dasharray="4,3" />
      
      <path d="M 392,145 C 322,235 272,345 227,450" stroke="#44444c" stroke-width="1.5" stroke-dasharray="4,3" />
      <path d="M 408,145 C 478,235 528,345 573,450" stroke="#44444c" stroke-width="1.5" stroke-dasharray="4,3" />
    </g>

    <!-- 5. Top Button -->
    <ellipse cx="400" cy="138" rx="16" ry="10" fill="#151518" stroke="#0a0a0d" stroke-width="2" />
    <ellipse cx="400" cy="136" rx="10" ry="5" fill="#2a2a30" opacity="0.7" />

    <!-- 6. Ventilation Grommets -->
    <g stroke="#1a1a1f" stroke-width="3" fill="#050508" opacity="0.9">
      <circle cx="330" cy="240" r="5" />
      <circle cx="470" cy="240" r="5" />
      <circle cx="270" cy="310" r="4.5" />
      <circle cx="530" cy="310" r="4.5" />
    </g>

    <!-- ================= BRANDING: TICKETNOW PATCH ================= -->
    <g id="cap-patch" filter="url(#patchShadow)" transform="translate(0, -10)">
      
      <!-- Patch Glowing Aura -->
      <path d="M 310,290 L 490,290 A 10,10 0 0 1 500,300 L 500,315 A 15,15 0 0 0 500,345 L 500,360 A 10,10 0 0 1 490,370 L 310,370 A 10,10 0 0 1 300,360 L 300,345 A 15,15 0 0 0 300,315 L 300,300 A 10,10 0 0 1 310,290 Z" fill="url(#neonBrand)" filter="url(#glow)" opacity="0.5" />

      <!-- Patch Base (Ticket Shape) -->
      <path d="M 310,290 L 490,290 A 10,10 0 0 1 500,300 L 500,315 A 15,15 0 0 0 500,345 L 500,360 A 10,10 0 0 1 490,370 L 310,370 A 10,10 0 0 1 300,360 L 300,345 A 15,15 0 0 0 300,315 L 300,300 A 10,10 0 0 1 310,290 Z" fill="#0f0d14" stroke="url(#neonBrand)" stroke-width="3" />

      <!-- Patch Inner Embroidery (Dashed Edge) -->
      <path d="M 312,295 L 488,295 A 5,5 0 0 1 493,300 L 493,312 A 18,18 0 0 0 493,348 L 493,360 A 5,5 0 0 1 488,365 L 312,365 A 5,5 0 0 1 307,360 L 307,348 A 18,18 0 0 0 307,312 L 307,300 A 5,5 0 0 1 312,295 Z" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4" />
      
      <!-- Patch Typography -->
      <text x="398" y="342" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-style="italic" font-size="28" text-anchor="middle">
        <tspan fill="#ffffff">TICKET</tspan>
        <tspan fill="url(#neonCyan)">NOW</tspan>
      </text>

      <!-- Decorative Barcode / Lines on Patch -->
      <g fill="url(#neonBrand)" opacity="0.8">
        <rect x="330" y="352" width="4" height="6" />
        <rect x="336" y="352" width="2" height="6" />
        <rect x="340" y="352" width="6" height="6" />
        <rect x="348" y="352" width="2" height="6" />
        <rect x="352" y="352" width="4" height="6" />
        <rect x="444" y="352" width="4" height="6" />
        <rect x="450" y="352" width="2" height="6" />
        <rect x="454" y="352" width="6" height="6" />
        <rect x="462" y="352" width="4" height="6" />
      </g>
    </g>

  </g>

  <!-- ================= POSTER TYPOGRAPHY & FOOTER ================= -->
  
  <g text-anchor="middle">
    <!-- Brand Title -->
    <text x="400" y="85" font-family="'Trebuchet MS', 'Lucida Sans Unicode', sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="12">
      TICKETNOW
    </text>
    
    <!-- Subtitle -->
    <text x="400" y="750" font-family="'Montserrat', 'Open Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="url(#neonBrand)" letter-spacing="6">
      GORRA OFICIAL PARA EVENTOS
    </text>
    <text x="400" y="775" font-family="'Montserrat', 'Open Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#666" letter-spacing="2">
      PREMIUM MERCHANDISE
    </text>
    
    <!-- Framing Lines -->
    <line x1="200" y1="744" x2="120" y2="744" stroke="url(#neonBrand)" stroke-width="2" />
    <line x1="600" y1="744" x2="680" y2="744" stroke="url(#neonBrand)" stroke-width="2" />
  </g>

</svg>
